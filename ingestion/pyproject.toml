[project]
name = "observatory"
version = "0.1.0"
description = "SC2 Balance Observatory ingestion layer"
requires-python = ">=3.12"
dependencies = ["boto3"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP017"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
