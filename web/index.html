<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opponent Lens · SC2 Balance Observatory</title>
<style>
  :root {
    --bg: #15171b; --panel: #1d2026; --border: #2b2f37;
    --text: #cfd3da; --muted: #7f8791; --accent: #6ea8dc;
    --terran: #4f8fd1; --protoss: #d4b23c; --zerg: #9b59d0; --random: #8a9199;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 16px; font-weight: 600; margin: 8px 0 2px; }
  h1 .btag { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; }
  td .btag { color: var(--muted); }
  .lang { color: var(--muted); font-size: 12px; cursor: pointer; user-select: none; }
  .lang b { color: var(--text); }
  .nav { font-size: 12px; }
  .nav a { color: var(--muted); text-decoration: none; margin-right: 14px; }
  .nav a:hover { color: var(--text); }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; max-width: 420px; padding: 7px 10px; background: var(--panel);
    border: 1px solid var(--border); color: var(--text); border-radius: 3px; font: inherit;
  }
  input:focus { outline: 1px solid var(--accent); }
  button {
    padding: 7px 16px; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 3px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  #status { color: var(--muted); font-size: 12px; margin: 10px 0; min-height: 18px; }
  table { border-collapse: collapse; width: 100%; margin: 6px 0 18px; }
  th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  #opp-table th { cursor: pointer; }
  #opp-table th:hover { color: var(--text); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.sel { cursor: pointer; }
  tr.sel:hover td { background: var(--panel); }
  #opp-body td.plink { cursor: pointer; }
  #opp-body td.plink:hover { text-decoration: underline; }
  .race { font-weight: 600; }
  .TERRAN { color: var(--terran); } .PROTOSS { color: var(--protoss); }
  .ZERG { color: var(--zerg); } .RANDOM { color: var(--random); }
  .cards { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 3px;
    padding: 8px 14px; min-width: 150px; cursor: pointer; user-select: none;
  }
  .card.active { border-color: var(--accent); }
  .card b { font-size: 15px; }
  .card div { font-size: 12px; color: var(--muted); }
  .card div span { color: var(--text); font-variant-numeric: tabular-nums; }
  #chartwrap { background: var(--panel); border: 1px solid var(--border); border-radius: 3px;
    padding: 10px; height: 420px; display: none; position: relative; }
  #chart-reset { position: absolute; top: 10px; right: 10px; z-index: 2;
    display: none; padding: 3px 10px; font-size: 12px; }
  footer { color: var(--muted); font-size: 11px; margin: 20px 0; }
  footer a { color: var(--muted); }
  section { display: none; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Opponent Lens</h1>
    <span class="nav"><a href="balance.html">Balance</a> <span class="lang" id="lang-toggle"></span></span>
  </div>
  <div class="sub" id="subtitle"></div>

  <div class="row">
    <input id="q" autofocus>
    <button id="go"></button>
  </div>
  <div id="status"></div>

  <section id="results">
    <table>
      <thead><tr id="results-head"></tr></thead>
      <tbody id="results-body"></tbody>
    </table>
  </section>

  <section id="detail">
    <h1 id="player-title"></h1>
    <div class="sub"><span id="player-delta"></span><span class="lang" id="days-toggle" style="margin-left: 12px"></span></div>
    <div class="cards" id="cards"></div>
    <div id="chartwrap"><button id="chart-reset"></button><canvas id="chart"></canvas></div>
    <table id="opp-table">
      <thead><tr id="opp-head"></tr></thead>
      <tbody id="opp-body"></tbody>
    </table>
  </section>

  <footer>Data: <a href="https://sc2pulse.nephest.com/sc2/">SC2 Pulse</a>. Not affiliated with Blizzard.</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3"></script>
<script>
const API = 'https://sc2pulse.nephest.com/sc2/api';
const RACES = { 1: 'TERRAN', 2: 'PROTOSS', 3: 'ZERG', 4: 'RANDOM' };
const COLORS = { TERRAN: '#4f8fd1', PROTOSS: '#d4b23c', ZERG: '#9b59d0', RANDOM: '#8a9199' };
const MAX_OPPONENTS = 30;

const I18N = {
  en: {
    subtitle: 'Search a player to see recent 1v1 opponents’ MMR trends',
    placeholder: 'Player name or BattleTag, e.g. Serral',
    search: 'Search', searching: 'Searching…',
    results: n => `${n} results, click to view`, noResults: 'No results',
    loadingMatches: 'Loading matches…',
    loadingHistories: (a, b) => `Loading opponent MMR history… ${a}/${b}`,
    no1v1: 'No recent 1v1 matches',
    chartFail: 'Chart library failed to load; the table below still works',
    reset: 'Reset',
    resultsHead: ['Character', 'BattleTag', 'Region', 'Max MMR', 'Games'],
    card: (n, w, l, d) => `<div>Opponents <span>${n}</span>, record <span>${w}–${l}</span></div>
      <div>Opp ${state.days}d MMR Δ median <span>${d}</span></div>`,
    oppHead: () => [['name', 'Opponent'], ['btag', 'BattleTag'], ['race', 'Race'], ['faced', 'Met'], ['wl', 'W–L'], ['mmr', 'MMR'], ['d30', `${state.days}d Δ`]],
    myDelta: d => `${d} MMR in ${state.days} days`,
    langLabel: '中文',
  },
  zh: {
    subtitle: '搜索玩家，查看近期 1v1 对手的 MMR 变化',
    placeholder: '玩家名或 BattleTag，如 Serral',
    search: '搜索', searching: '搜索中…',
    results: n => `${n} 个结果，点击查看`, noResults: '无结果',
    loadingMatches: '拉取比赛记录…',
    loadingHistories: (a, b) => `拉取对手 MMR 历史… ${a}/${b}`,
    no1v1: '近期没有 1v1 比赛记录',
    chartFail: '图表库加载失败，下方表格仍可用',
    reset: '重置',
    resultsHead: ['角色', 'BattleTag', '地区', '最高 MMR', '总场次'],
    card: (n, w, l, d) => `<div>对手 <span>${n}</span> 人，战绩 <span>${w}–${l}</span></div>
      <div>对手 ${state.days} 天 MMR Δ 中位 <span>${d}</span></div>`,
    oppHead: () => [['name', '对手'], ['btag', 'BattleTag'], ['race', '种族'], ['faced', '交手'], ['wl', '胜–负'], ['mmr', '当前 MMR'], ['d30', `${state.days} 天 Δ`]],
    myDelta: d => `近 ${state.days} 天 ${d} MMR`,
    langLabel: 'EN',
  },
};

const state = { lang: 'en', days: 30, char: null, opps: [], raceFilter: null, soloUid: null, sortKey: 'faced', sortDir: -1 };
const $ = id => document.getElementById(id);
const t = () => I18N[state.lang];
const status = msg => { $('status').textContent = msg || ''; };
const esc = s => { const d = document.createElement('span'); d.textContent = s ?? ''; return d.innerHTML; };
const fmtDelta = d => d === null ? '–' : (d > 0 ? '+' : '') + d;
let chart = null;

function applyLang() {
  $('subtitle').textContent = t().subtitle;
  $('q').placeholder = t().placeholder;
  $('go').textContent = t().search;
  $('lang-toggle').innerHTML = `<b>${t().langLabel}</b>`;
  $('results-head').innerHTML = t().resultsHead
    .map((h, i) => `<th class="${i >= 3 ? 'num' : ''}">${h}</th>`).join('');
  if (state.opps.length) renderDetail();
}

async function get(path, params) {
  const url = API + path + '?' + new URLSearchParams(params);
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Pulse API ${r.status}`);
  return r.json();
}

async function search() {
  const q = $('q').value.trim();
  if (!q) return;
  status(t().searching);
  $('detail').style.display = 'none';
  try {
    const found = await get('/characters', { query: q });
    const body = $('results-body');
    body.innerHTML = '';
    for (const c of found.slice(0, 20)) {
      const ch = c.members.character, acc = c.members.account;
      const tr = document.createElement('tr');
      tr.className = 'sel';
      tr.innerHTML = `<td>${esc(ch.name)}</td><td>${esc(acc.battleTag)}</td><td>${esc(ch.region)}</td>
        <td class="num">${c.ratingMax ?? '–'}</td><td class="num">${c.totalGamesPlayed ?? '–'}</td>`;
      tr.onclick = () => load(c);
      body.appendChild(tr);
    }
    $('results').style.display = 'block';
    status(found.length ? t().results(found.length) : t().noResults);
  } catch (e) { status(e.message); }
}

function collectOpponents(matches, myId) {
  const opps = new Map();
  for (const m of matches) {
    if (m.match.type !== '_1V1' || m.participants.length !== 2) continue;
    const mine = m.participants.find(p => p.participant.playerCharacterId === myId);
    const theirs = m.participants.find(p => p.participant.playerCharacterId !== myId);
    if (!mine || !theirs || !theirs.team) continue;
    const uid = theirs.team.legacyUid;
    const race = RACES[(uid.match(/\.([1-4])$/) || [])[1]];
    if (!race) continue;
    const o = opps.get(uid) || {
      uid, race,
      name: (theirs.team.members[0]?.character.name || '?').split('#')[0],
      btag: theirs.team.members[0]?.account?.battleTag || '',
      characterId: theirs.team.members[0]?.character.id,
      pro: theirs.team.members[0]?.proNickname,
      rating: theirs.team.rating,
      faced: 0, wins: 0, losses: 0, lastDate: m.match.date,
    };
    o.faced++;
    if (mine.participant.decision === 'WIN') o.wins++;
    if (mine.participant.decision === 'LOSS') o.losses++;
    opps.set(uid, o);
  }
  return [...opps.values()]
    .sort((a, b) => new Date(b.lastDate) - new Date(a.lastDate))
    .slice(0, MAX_OPPONENTS);
}

async function fetchHistories(opps) {
  const from = new Date(Date.now() - state.days * 86400e3).toISOString();
  const byUid = new Map();
  for (let i = 0; i < opps.length; i += 10) {
    const chunk = opps.slice(i, i + 10).map(o => o.uid);
    status(t().loadingHistories(Math.min(i + 10, opps.length), opps.length));
    const rows = await get('/team-histories', {
      teamLegacyUid: chunk.join(','), history: 'TIMESTAMP,RATING', from,
    });
    for (const row of rows || []) {
      byUid.set(row.staticData.LEGACY_UID, dailyLast(row.history.TIMESTAMP, row.history.RATING));
    }
  }
  return byUid;
}

function dailyLast(ts, rating) {
  const out = [];
  for (let i = 0; i < ts.length; i++) {
    const day = Math.floor(ts[i] / 86400);
    if (out.length && out[out.length - 1].day === day) out[out.length - 1] = { day, x: ts[i] * 1000, y: rating[i] };
    else out.push({ day, x: ts[i] * 1000, y: rating[i] });
  }
  return out;
}

const delta = points => points.length > 1 ? points[points.length - 1].y - points[0].y : null;

async function load(c) {
  state.char = c;
  const myId = c.members.character.id;
  $('results').style.display = 'none';
  $('detail').style.display = 'block';
  $('player-title').innerHTML = esc(c.members.character.name.split('#')[0]) +
    (c.members.account?.battleTag ? ` <span class="btag">${esc(c.members.account.battleTag)}</span>` : '');
  $('cards').innerHTML = '';
  $('opp-body').innerHTML = '';
  state.opps = [];
  state.me = null;
  state.raceFilter = null;
  state.soloUid = null;
  status(t().loadingMatches);
  try {
    const page = await get('/character-matches', { characterId: myId, type: '_1V1', limit: 100 });
    const matches = page.result || [];
    const opps = collectOpponents(matches, myId);
    if (!opps.length) { status(t().no1v1); return; }

    const myTeams = new Map();
    for (const m of matches) {
      const mine = m.participants.find(p => p.participant.playerCharacterId === myId);
      if (mine?.team) myTeams.set(mine.team.legacyUid, (myTeams.get(mine.team.legacyUid) || 0) + 1);
    }
    const myUid = [...myTeams.entries()].sort((a, b) => b[1] - a[1])[0]?.[0];

    const histories = await fetchHistories(myUid ? [...opps, { uid: myUid }] : opps);
    for (const o of opps) {
      o.points = histories.get(o.uid) || [];
      o.d30 = delta(o.points);
      o.mmr = o.points.at(-1)?.y ?? o.rating ?? null;
      o.wl = o.wins * 1000 - o.losses;
    }
    const myPoints = myUid ? histories.get(myUid) || [] : [];
    state.me = { uid: myUid, name: c.members.character.name.split('#')[0], points: myPoints, d30: delta(myPoints) };
    state.opps = opps;
    renderDetail();
    status('');
  } catch (e) { status(e.message); }
}

function renderDetail() {
  $('player-delta').textContent = state.me?.d30 != null ? t().myDelta(fmtDelta(state.me.d30)) : '';
  $('days-toggle').innerHTML = state.days === 30 ? '<b>30d</b> · 90d' : '30d · <b>90d</b>';
  renderCards();
  renderChart();
  renderTable();
}

function renderCards() {
  const cards = $('cards');
  cards.innerHTML = '';
  for (const race of ['TERRAN', 'PROTOSS', 'ZERG', 'RANDOM']) {
    const group = state.opps.filter(o => o.race === race);
    if (!group.length) continue;
    const wins = group.reduce((s, o) => s + o.wins, 0);
    const losses = group.reduce((s, o) => s + o.losses, 0);
    const deltas = group.map(o => o.d30).filter(d => d !== null).sort((a, b) => a - b);
    const med = deltas.length ? fmtDelta(deltas[deltas.length >> 1]) : '–';
    const el = document.createElement('div');
    el.className = 'card' + (state.raceFilter === race ? ' active' : '');
    el.innerHTML = `<b class="race ${race}">${race}</b>` + t().card(group.length, wins, losses, med);
    el.onclick = () => {
      state.raceFilter = state.raceFilter === race ? null : race;
      state.soloUid = null;
      renderDetail();
    };
    cards.appendChild(el);
  }
}

const filtered = () => state.raceFilter ? state.opps.filter(o => o.race === state.raceFilter) : state.opps;

function renderTable() {
  const head = $('opp-head');
  head.innerHTML = t().oppHead()
    .map(([k, h], i) => {
      const arrow = state.sortKey === k ? (state.sortDir > 0 ? ' ↑' : ' ↓') : '';
      return `<th class="${i >= 3 ? 'num' : ''}" data-k="${k}">${h}${arrow}</th>`;
    }).join('');
  for (const th of head.querySelectorAll('th')) {
    th.onclick = () => {
      const k = th.dataset.k;
      if (state.sortKey === k) state.sortDir *= -1;
      else { state.sortKey = k; state.sortDir = -1; }
      renderTable();
    };
  }

  const rows = [...filtered()].sort((a, b) => {
    const va = a[state.sortKey], vb = b[state.sortKey];
    if (va === null) return 1;
    if (vb === null) return -1;
    return (typeof va === 'string' ? va.localeCompare(vb) : va - vb) * state.sortDir;
  });

  const body = $('opp-body');
  body.innerHTML = '';
  for (const o of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${esc(o.name)}${o.pro ? ` <span class="race ${o.race}">[${esc(o.pro)}]</span>` : ''}</td>
      <td><span class="btag">${esc(o.btag)}</span></td>
      <td class="race ${o.race}">${o.race[0]}</td>
      <td class="num">${o.faced}</td><td class="num">${o.wins}–${o.losses}</td>
      <td class="num">${o.mmr ?? '–'}</td>
      <td class="num">${fmtDelta(o.d30)}</td>`;
    if (o.characterId) {
      tr.firstElementChild.classList.add('plink');
      tr.firstElementChild.onclick = () => loadOpp(o);
    }
    body.appendChild(tr);
  }
}

function loadOpp(o) {
  $('q').value = o.name;
  load({ members: { character: { id: o.characterId, name: o.name }, account: { battleTag: o.btag } } });
}

let hoverIdx = null;

function renderChart() {
  if (typeof Chart === 'undefined') { status(t().chartFail); return; }
  let opps = filtered().filter(o => o.points.length > 1);
  if (state.soloUid) {
    const solo = opps.filter(o => o.uid === state.soloUid);
    if (solo.length) opps = solo; else state.soloUid = null;
  }
  const datasets = opps.map(o => ({
    label: `${o.name} (${o.race[0]})`,
    uid: o.uid,
    data: o.points,
    baseColor: COLORS[o.race], baseAlpha: '73', baseWidth: 1.1,
    borderColor: COLORS[o.race] + '73',
    borderWidth: 1.1,
    pointRadius: 0,
    parsing: false,
  }));
  if (state.me?.points.length > 1) {
    datasets.push({
      label: state.me.name,
      uid: state.me.uid,
      me: true,
      data: state.me.points,
      baseColor: '#e8eaed', baseAlpha: 'ff', baseWidth: 2.4,
      borderColor: '#e8eaed',
      borderWidth: 2.4,
      pointRadius: 0,
      parsing: false,
    });
  }
  $('chartwrap').style.display = datasets.length ? 'block' : 'none';
  $('chart-reset').textContent = t().reset;
  $('chart-reset').style.display = state.soloUid ? 'block' : 'none';
  chart?.destroy();
  hoverIdx = null;
  if (!datasets.length) return;
  chart = new Chart($('chart'), {
    type: 'line',
    data: { datasets },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'nearest', intersect: false },
      onClick: (e, _els, ch) => {
        const els = ch.getElementsAtEventForMode(e, 'nearest', { intersect: false }, true);
        if (!els.length) return;
        const d = ch.data.datasets[els[0].datasetIndex];
        if (d.me) return;
        state.soloUid = state.soloUid === d.uid ? null : d.uid;
        renderChart();
      },
      onHover: (e, _els, ch) => {
        const els = ch.getElementsAtEventForMode(e, 'nearest', { intersect: false }, true);
        const idx = els.length ? els[0].datasetIndex : null;
        if (idx === hoverIdx) return;
        hoverIdx = idx;
        ch.data.datasets.forEach((d, i) => {
          if (d.me || idx === null) {
            d.borderColor = d.baseColor + (d.baseAlpha === 'ff' ? '' : d.baseAlpha);
            d.borderWidth = d.baseWidth;
          } else {
            d.borderColor = d.baseColor + (i === idx ? '' : '2e');
            d.borderWidth = i === idx ? Math.max(d.baseWidth, 2.2) : d.baseWidth;
          }
        });
        ch.update('none');
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: items => new Date(items[0].parsed.x).toLocaleDateString(),
            label: item => `${item.dataset.label}: ${item.parsed.y}`,
          },
        },
      },
      scales: {
        x: {
          type: 'linear',
          grid: { color: '#2b2f37' },
          ticks: { color: '#7f8791', maxTicksLimit: 10,
            callback: v => new Date(v).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) },
        },
        y: {
          title: { display: true, text: 'MMR', color: '#7f8791' },
          grid: { color: '#2b2f37' },
          ticks: { color: '#7f8791' },
        },
      },
    },
  });
}

$('go').onclick = search;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
$('chart-reset').onclick = () => {
  state.soloUid = null;
  renderChart();
};
$('days-toggle').onclick = () => {
  state.days = state.days === 30 ? 90 : 30;
  if (state.char) load(state.char);
};
$('lang-toggle').onclick = () => {
  state.lang = state.lang === 'en' ? 'zh' : 'en';
  document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
  applyLang();
};
applyLang();
</script>
</body>
</html>
