<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance · SC2 Balance Observatory</title>
<style>
  :root {
    --bg: #15171b; --panel: #1d2026; --border: #2b2f37;
    --text: #cfd3da; --muted: #7f8791; --accent: #6ea8dc;
    --pos: #d4b23c; --neg: #4f8fd1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 16px; font-weight: 600; margin: 8px 0 2px; }
  h2 { font-size: 13px; font-weight: 600; margin: 24px 0 8px; color: var(--text); }
  .nav { color: var(--muted); font-size: 12px; }
  .nav a { color: var(--muted); text-decoration: none; margin-left: 14px; }
  .nav a:hover { color: var(--text); }
  .nav .lang { cursor: pointer; user-select: none; margin-left: 14px; }
  .nav .lang b { color: var(--text); }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; margin: 14px 0; }
  .controls label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 3px; }
  select { padding: 6px 8px; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 3px; font: inherit; }
  table { border-collapse: collapse; width: 100%; margin: 6px 0 8px; }
  th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  #heatmap td.cell { text-align: center; font-variant-numeric: tabular-nums; width: 110px; }
  .sig { font-weight: 600; }
  .chartbox { background: var(--panel); border: 1px solid var(--border); border-radius: 3px;
    padding: 10px; height: 360px; }
  .note { color: var(--muted); font-size: 11px; margin: 4px 0 0; }
  footer { color: var(--muted); font-size: 11px; margin: 24px 0; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 id="title"></h1>
    <span class="nav">
      <a href="index.html">Opponent Lens</a>
      <span class="lang" id="lang-toggle"></span>
    </span>
  </div>
  <div class="sub" id="subtitle"></div>

  <div class="controls">
    <div><label id="l-season"></label><select id="f-season"></select></div>
    <div><label id="l-region"></label><select id="f-region"></select></div>
    <div><label id="l-league"></label><select id="f-league"></select></div>
    <span class="note" id="updated"></span>
  </div>

  <h2 id="h-heatmap"></h2>
  <table id="heatmap"></table>
  <div class="note" id="n-heatmap"></div>

  <h2 id="h-length"></h2>
  <div class="chartbox"><canvas id="length-chart"></canvas></div>

  <h2 id="h-delta"></h2>
  <table id="delta-table"></table>

  <h2 id="h-patch"></h2>
  <div class="chartbox"><canvas id="patch-chart"></canvas></div>
  <div class="note" id="n-patch"></div>

  <footer>Data: <a href="https://sc2pulse.nephest.com/sc2/">SC2 Pulse</a> ·
    <a href="https://aligulac.com/">Aligulac</a> (non-commercial). Not affiliated with Blizzard.</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3"></script>
<script>
const M_COLORS = { PvT: '#2f6fa8', TvZ: '#6fb3d8', ZvP: '#b0508c' };
const MATCHUPS = ['PvT', 'TvZ', 'ZvP'];
const LEAGUES = ['DIAMOND', 'MASTER', 'GRANDMASTER'];
const LEAGUE_LABEL = { DIAMOND: 'Diamond', MASTER: 'Master', GRANDMASTER: 'Grandmaster' };

const I18N = {
  en: {
    title: 'Balance Observatory', subtitle: 'SC2 ladder & pro balance, Diamond league and above',
    season: 'Season', region: 'Region', league: 'League',
    updated: ts => `data updated ${ts}`,
    hHeatmap: 'Winrate by matchup × league',
    nHeatmap: 'Winrate of the first race in the matchup. Blue = below 50%, gold = above.',
    hLength: 'Winrate by game length (minutes)',
    hDelta: 'Season-over-season winrate change',
    hPatch: 'Pro winrate shift, 28 days before vs after balance patches',
    nPatch: 'Aligulac pro matches. Solid = statistically significant (z-test, α=0.05).',
    deltaHead: [['season_bnet_id', 'Season'], ['region', 'Region'], ['league', 'League'], ['matchup', 'Matchup'],
      ['winrate_prev_pct', 'Prev %'], ['winrate_cur_pct', 'Cur %'], ['delta_pct', 'Δ pp']],
    langLabel: '中文',
  },
  zh: {
    title: 'Balance Observatory', subtitle: '星际2 天梯与职业平衡观测 · 钻石及以上',
    season: '赛季', region: '地区', league: '段位',
    updated: ts => `数据更新于 ${ts}`,
    hHeatmap: '对阵胜率 × 段位',
    nHeatmap: '数值为对阵中前一个种族的胜率。蓝 = 低于 50%，金 = 高于 50%。',
    hLength: '胜率 × 比赛时长（分钟）',
    hDelta: '赛季环比胜率变化',
    hPatch: '平衡补丁前后 28 天职业胜率变化',
    nPatch: '数据来自 Aligulac 职业比赛。加粗 = 统计显著（z 检验，α=0.05）。',
    deltaHead: [['season_bnet_id', '赛季'], ['region', '地区'], ['league', '段位'], ['matchup', '对阵'],
      ['winrate_prev_pct', '上季 %'], ['winrate_cur_pct', '本季 %'], ['delta_pct', 'Δ 百分点']],
    langLabel: 'EN',
  },
};

const state = { lang: 'en', season: null, region: 'ALL', league: 'DIAMOND', deltaSort: { key: null, dir: -1 } };
const data = {};
const $ = id => document.getElementById(id);
const t = () => I18N[state.lang];
const n = v => v == null ? null : +v;
const pct = v => (100 * v).toFixed(1) + '%';
const fmtD = d => d === null ? '–' : (d > 0 ? '+' : '') + d;
let lengthChart = null, patchChart = null;

async function boot() {
  const names = ['profile', 'game_length', 'season_delta', 'patch_event', 'meta'];
  const loaded = await Promise.all(names.map(f =>
    fetch(`data/${f}.json`).then(r => r.ok ? r.json() : (f === 'meta' ? {} : []))));
  names.forEach((f, i) => data[f] = loaded[i]);

  const seasons = [...new Set(data.profile.map(r => n(r.season_bnet_id)))].sort((a, b) => b - a);
  state.season = seasons[0];
  fillSelect('f-season', seasons.map(s => [s, s]), state.season);
  fillSelect('f-region', ['ALL', 'EU', 'US', 'KR'].map(r => [r, r]), state.region);
  fillSelect('f-league', LEAGUES.map(l => [l, LEAGUE_LABEL[l]]), state.league);
  $('f-season').onchange = e => { state.season = +e.target.value; render(); };
  $('f-region').onchange = e => { state.region = e.target.value; render(); };
  $('f-league').onchange = e => { state.league = e.target.value; render(); };
  applyLang();
}

function fillSelect(id, options, value) {
  $(id).innerHTML = options.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  $(id).value = value;
}

function applyLang() {
  $('title').textContent = t().title;
  $('subtitle').textContent = t().subtitle;
  $('lang-toggle').innerHTML = `<b>${t().langLabel}</b>`;
  $('l-season').textContent = t().season;
  $('l-region').textContent = t().region;
  $('l-league').textContent = t().league;
  $('h-heatmap').textContent = t().hHeatmap;
  $('n-heatmap').textContent = t().nHeatmap;
  $('h-length').textContent = t().hLength;
  $('h-delta').textContent = t().hDelta;
  $('h-patch').textContent = t().hPatch;
  $('n-patch').textContent = t().nPatch;
  $('updated').textContent = data.meta?.generated_at ? t().updated(data.meta.generated_at) : '';
  render();
}

function render() {
  renderHeatmap();
  renderLength();
  renderDelta();
  renderPatch();
}

function heatColor(w) {
  const d = w - 0.5;
  const alpha = Math.min(Math.abs(d) / 0.05, 1) * 0.75;
  const hex = Math.round(alpha * 255).toString(16).padStart(2, '0');
  return (d >= 0 ? '#d4b23c' : '#4f8fd1') + hex;
}

function renderHeatmap() {
  const rows = data.profile.filter(r =>
    n(r.season_bnet_id) === state.season && r.region === state.region);
  const byKey = new Map(rows.map(r => [r.league + '|' + r.matchup, r]));
  let html = '<tr><th></th>' + MATCHUPS.map(m => `<th class="cell">${m}</th>`).join('') + '</tr>';
  for (const lg of LEAGUES) {
    const hl = lg === state.league ? ' style="color:var(--accent)"' : '';
    html += `<tr><th${hl}>${LEAGUE_LABEL[lg]}</th>` + MATCHUPS.map(m => {
      const r = byKey.get(lg + '|' + m);
      if (!r) return '<td class="cell">–</td>';
      const w = n(r.winrate);
      return `<td class="cell" style="background:${heatColor(w)}" title="${n(r.games)} games">${pct(w)}</td>`;
    }).join('') + '</tr>';
  }
  $('heatmap').innerHTML = html;
}

function renderLength() {
  if (typeof Chart === 'undefined') return;
  const rows = data.game_length.filter(r =>
    n(r.season_bnet_id) === state.season && r.region === state.region && r.league === state.league);
  const datasets = MATCHUPS.map(m => ({
    label: m,
    data: rows.filter(r => r.matchup === m)
      .map(r => ({ x: n(r.minute_bucket), y: n(r.winrate) }))
      .sort((a, b) => a.x - b.x),
    borderColor: M_COLORS[m], backgroundColor: M_COLORS[m],
    borderWidth: 1.8, pointRadius: 0, parsing: false,
  })).filter(d => d.data.length);
  lengthChart?.destroy();
  lengthChart = new Chart($('length-chart'), {
    type: 'line',
    data: { datasets },
    options: {
      animation: false, responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'nearest', intersect: false },
      plugins: { legend: { labels: { color: '#cfd3da', boxWidth: 12 } },
        tooltip: { callbacks: { label: i => `${i.dataset.label}: ${pct(i.parsed.y)}` } } },
      scales: {
        x: { type: 'linear', grid: { color: '#2b2f37' }, ticks: { color: '#7f8791' } },
        y: { grid: { color: '#2b2f37' },
          ticks: { color: '#7f8791', callback: v => Math.round(v * 100) + '%' } },
      },
    },
  });
}

const NUM_KEYS = new Set(['season_bnet_id', 'winrate_prev_pct', 'winrate_cur_pct', 'delta_pct']);

function renderDelta() {
  const { key, dir } = state.deltaSort;
  const rows = data.season_delta
    .filter(r => (state.region === 'ALL' || r.region === state.region) && r.league === state.league)
    .sort((a, b) => {
      if (!key) return (b.delta_significant === 'true') - (a.delta_significant === 'true')
        || Math.abs(n(b.delta_pct)) - Math.abs(n(a.delta_pct));
      const va = NUM_KEYS.has(key) ? n(a[key]) : a[key];
      const vb = NUM_KEYS.has(key) ? n(b[key]) : b[key];
      return (typeof va === 'string' ? va.localeCompare(vb) : va - vb) * dir;
    });
  let html = '<tr>' + t().deltaHead
    .map(([k, h], i) => {
      const arrow = key === k ? (dir > 0 ? ' ↑' : ' ↓') : '';
      return `<th class="${i >= 4 ? 'num' : ''}" data-k="${k}" style="cursor:pointer">${h}${arrow}</th>`;
    }).join('') + '</tr>';
  for (const r of rows) {
    const sig = r.delta_significant === 'true';
    html += `<tr${sig ? ' class="sig"' : ''} title="${r.patches_in_season ?? ''}">
      <td>${n(r.season_bnet_id)}</td><td>${r.region}</td><td>${LEAGUE_LABEL[r.league]}</td><td>${r.matchup}</td>
      <td class="num">${r.winrate_prev_pct}</td><td class="num">${r.winrate_cur_pct}</td>
      <td class="num">${fmtD(n(r.delta_pct))}</td></tr>`;
  }
  $('delta-table').innerHTML = html;
  for (const th of $('delta-table').querySelectorAll('th[data-k]')) {
    th.onclick = () => {
      const k = th.dataset.k;
      if (state.deltaSort.key === k) state.deltaSort.dir *= -1;
      else state.deltaSort = { key: k, dir: -1 };
      renderDelta();
    };
  }
}

function renderPatch() {
  if (typeof Chart === 'undefined') return;
  const versions = [...new Set(data.patch_event.map(r => r.version))];
  const byKey = new Map(data.patch_event.map(r => [r.version + '|' + r.matchup, r]));
  const datasets = MATCHUPS.map(m => ({
    label: m,
    data: versions.map(v => n(byKey.get(v + '|' + m)?.delta_pct)),
    backgroundColor: versions.map(v =>
      M_COLORS[m] + (byKey.get(v + '|' + m)?.delta_significant === 'true' ? '' : '59')),
    borderColor: M_COLORS[m], borderWidth: 1,
  }));
  patchChart?.destroy();
  patchChart = new Chart($('patch-chart'), {
    type: 'bar',
    data: { labels: versions, datasets },
    options: {
      animation: false, responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#cfd3da', boxWidth: 12 } },
        tooltip: { callbacks: {
          label: i => {
            const r = byKey.get(i.label + '|' + i.dataset.label);
            return `${i.dataset.label}: ${fmtD(n(r?.delta_pct))} pp` +
              (r?.delta_significant === 'true' ? ' *' : '') +
              ` (${n(r?.games_pre)}/${n(r?.games_post)} games)`;
          } } } },
      scales: {
        x: { grid: { color: '#2b2f37' }, ticks: { color: '#7f8791' } },
        y: { grid: { color: '#2b2f37' },
          ticks: { color: '#7f8791', callback: v => fmtD(v) + 'pp' } },
      },
    },
  });
}

$('lang-toggle').onclick = () => {
  state.lang = state.lang === 'en' ? 'zh' : 'en';
  document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
  applyLang();
};
boot();
</script>
</body>
</html>
