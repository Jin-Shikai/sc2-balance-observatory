name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest boto3
      - run: ruff check ingestion
      - run: cd ingestion && python -m pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd web && npm install && npm run check

  deploy:
    # skipped until OIDC deploy variables are configured (see README)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: [python, terraform]
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VAR_databricks_host: ${{ vars.DATABRICKS_HOST }}
      TF_VAR_git_url: ${{ github.server_url }}/${{ github.repository }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: >
          terraform -chdir=infra init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=sc2obs.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
      - run: terraform -chdir=infra apply -auto-approve
